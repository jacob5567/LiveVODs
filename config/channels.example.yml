# The lineup — copy this to config/channels.yml and edit it.
#
#   cp config/channels.example.yml config/channels.yml
#   npm run channels:sync -- --dry-run    # resolve against the APIs, write nothing
#   npm run channels:sync                 # apply
#
# channels.yml is gitignored, so your own lineup stays out of the repository.
#
# A subject is one row on the guide — the equivalent of a cable channel. It
# pools several creators, because one creator rarely publishes enough to fill a
# timeline on their own. Row order here is row order on the grid.
#
# Twitch entries are login names, exactly as in twitch.tv/<login>.
# YouTube entries are handles including the leading @, as in youtube.com/@<handle>.
#
# A channel may appear in more than one subject; its programs show up on every
# row it belongs to. Both platform lists are optional.
#
# How a row fills: anything live or scheduled is an appointment and sits at its
# real time. Everything already published — YouTube uploads, past streams and
# Twitch VODs — becomes the library that fills the gaps around those
# appointments, so a row is never blank. Give each subject enough back
# catalogue to fill a day and it behaves like a real channel.

subjects:
  - name: Speedrunning
    twitch:
      - GamesDoneQuick
      - SimpleFlips
    youtube:
      - "@SimpleFlips"

  - name: Coffee
    youtube:
      - "@jameshoffmann"

  - name: Programming
    twitch:
      - theprimeagen
      - tsoding
    youtube:
      - "@ThePrimeTimeagen"
